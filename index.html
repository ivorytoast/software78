<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>software78</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background: #f9f9f9;
            color: #222;
        }

        .grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            min-height: 100vh;
        }

        /* ── Left column ── */
        .col-left {
            background: #fff;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            border-right: 1px solid #e0e0e0;
        }

        .col-left-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #888;
        }

        .company-name {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .motto {
            font-size: 1rem;
            font-style: italic;
            color: #555;
            margin-top: -0.5rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
        }

        .social-links a {
            color: #444;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: #000;
        }

        .social-links svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            display: block;
        }

        /* ── Right column: floating ghost cards ── */
        .col-right {
            display: flex;
            flex-direction: column;
            padding: 0;
            background: #faf9f7;
        }

        .apps-grid {
            display: flex;
            flex-direction: column;
        }

        .app-card {
            position: relative;
            display: block;
            overflow: hidden;
            min-height: 150px;
            background: #fff;
            text-decoration: none;
            color: inherit;
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .app-card:hover {
            box-shadow: inset 0 0 0 999px rgba(0, 0, 0, .015);
        }

        /* Watermark logo bleeding off the bottom-right corner */
        .app-watermark {
            position: absolute;
            right: -22px;
            bottom: -26px;
            width: 104px;
            height: 104px;
            border-radius: 26px;
            opacity: .7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-size: 0.7rem;
            color: #b9c7e8;
        }

        /* Text block — capped on the right so copy never reaches the watermark */
        .app-label {
            position: absolute;
            left: 18px;
            bottom: 18px;
            right: 84px;
        }

        .app-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1c1917;
            line-height: 1.1;
        }

        .app-desc {
            font-size: 0.75rem;
            line-height: 1.45;
            color: #78716c;
            margin-top: 0.25rem;
            text-wrap: pretty;
        }

        /* Per-card accent: top border + watermark gradient */
        .app-card:nth-child(1) { border-top: 4px solid #bfdbfe; }
        .app-card:nth-child(1) .app-watermark { background: linear-gradient(135deg, #f5f7ff, #dbeafe); color: #b9c7e8; }

        .app-card:nth-child(2) { border-top: 4px solid #ddd6fe; }
        .app-card:nth-child(2) .app-watermark { background: linear-gradient(135deg, #f6f2fe, #ede9fe); color: #cbbce8; }

        .app-card:nth-child(3) { border-top: 4px solid #a7f3d0; }
        .app-card:nth-child(3) .app-watermark { background: linear-gradient(135deg, #f0fdf6, #d1fae5); color: #9ad9b6; }

        .app-card:nth-child(4) { border-top: 4px solid #fde68a; }
        .app-card:nth-child(4) .app-watermark { background: linear-gradient(135deg, #fff9f0, #fde8c8); color: #e3c896; }

        /* ── Desktop: center left column, cards fill full screen height ── */
        @media (min-width: 769px) {
            .col-left {
                padding-right: 1rem;
            }

            .col-left-content {
                justify-content: center;
                align-items: center;
            }

            .site-footer {
                text-align: center;
            }

            .apps-grid {
                flex: 1;
            }

            .app-card {
                flex: 1;
            }
        }

        .site-footer {
            font-size: 0.78rem;
            color: #aaa;
        }

        /* ── Mobile: single column ── */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                align-content: start;
            }

            .col-left-content {
                flex: none;
            }

            .col-left {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                padding-bottom: 1.5rem;
            }

            .site-footer {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="grid">

    <!-- Left: identity & links -->
    <div class="col-left">

            <div class="logo-placeholder">Logo</div>
            <div class="company-name">software78</div>
            <div class="motto">"Software For Humans"</div>

    </div>

    <!-- Right: apps grid (floating ghost cards) -->
    <div class="col-right">
        <div class="apps-grid">
            <a class="app-card" href="https://www.surge15.app">
                <!-- Drop the real surge15 logo in place of the placeholder div below -->
                <div class="app-watermark">logo</div>
                <div class="app-label">
                    <div class="app-name">surge15</div>
                    <div class="app-desc">Run The Same Loop, Anywhere</div>
                </div>
            </a>
            <a class="app-card" href="https://www.hamillpainting.com">
                <div class="app-watermark">logo</div>
                <div class="app-label">
                    <div class="app-name">hpw</div>
                    <div class="app-desc">Hamill Painting & Wallpapering</div>
                </div>
            </a>
            <a class="app-card" href="#">
                <div class="app-watermark">logo</div>
                <div class="app-label">
                    <div class="app-name">fund78</div>
                    <div class="app-desc">Coming Soon!</div>
                </div>
            </a>
        </div>
    </div>

</div>
</body>
</html>
