<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>software78</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Spectral:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f9f9f9;
            color: #222;
        }

        .grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            min-height: 100vh;
        }

        /* ── Left column ── */
        .col-left {
            background: url('software78-meadow-desktop.png') center bottom / cover no-repeat, #fdf8f0;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            border-right: 1px solid #e6ddca;
            position: relative;
        }

        /* Desktop top-center project nav (fund78 always screen-centered) */
        .project-nav {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            column-gap: 24px;
            padding: 16px 34px;
            background: rgba(253, 248, 240, 0.55);
            border-bottom: 1px solid rgba(180, 168, 144, 0.4);
            -webkit-backdrop-filter: blur(3px);
            backdrop-filter: blur(3px);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .pn-link {
            color: #5a5142;
            text-decoration: none;
            border-bottom: 1.5px solid #c9bda6;
            padding-bottom: 2px;
            transition: border-color 0.2s ease;
        }

        .pn-link:hover { border-color: #5a5142; }
        .pn-left { justify-self: end; }
        .pn-center { justify-self: center; }
        .pn-right { justify-self: start; }

        .col-left-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .logo-placeholder {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.45);
            border: 1.5px solid #d3c8b6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #b6ab97;
        }

        .company-name {
            font-size: 1.95rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: #2a2620;
        }

        .motto {
            font-family: "Spectral", Georgia, serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #897c68;
            margin-top: -0.25rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
        }

        .social-links a {
            color: #6b5f4e;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: #2a2620;
        }

        .social-links svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            display: block;
        }

        /* ── Right column: floating ghost cards ── */
        .col-right {
            display: flex;
            flex-direction: column;
            padding: 0;
            background: #faf9f7;
        }

        .apps-grid {
            display: flex;
            flex-direction: column;
        }

        .app-card {
            position: relative;
            display: block;
            overflow: hidden;
            min-height: 150px;
            background: #fff;
            text-decoration: none;
            color: inherit;
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .app-card:hover {
            box-shadow: inset 0 0 0 999px rgba(0, 0, 0, .015);
        }

        /* Watermark logo bleeding off the bottom-right corner */
        .app-watermark {
            position: absolute;
            right: -22px;
            bottom: -26px;
            width: 104px;
            height: 104px;
            border-radius: 26px;
            opacity: .7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-size: 0.7rem;
            color: #b9c7e8;
        }

        /* Text block — capped on the right so copy never reaches the watermark */
        .app-label {
            position: absolute;
            left: 18px;
            bottom: 18px;
            right: 84px;
        }

        .app-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1c1917;
            line-height: 1.1;
        }

        .app-desc {
            font-size: 0.75rem;
            line-height: 1.45;
            color: #78716c;
            margin-top: 0.25rem;
            text-wrap: pretty;
        }

        /* Per-card accent: top border + watermark gradient */
        .app-card:nth-child(1) { border-top: 4px solid #bfdbfe; }

        /* surge15 mark — dark app-icon tile with the 15 lockup */
        .app-card.surge {
            background: #fff url('surge-trail.png') no-repeat 10px bottom;
            background-size: 230px auto;
        }
        .app-card.surge .app-watermark {
            background: transparent;
            width: 68px;
            height: 68px;
            right: 18px;
            top: 50%;
            bottom: auto;
            transform: translateY(-50%);
            opacity: 1;
        }
        .surge-icon {
            width: 68px;
            height: 68px;
            display: block;
        }
        .app-card.surge .app-label {
            left: 18px;
            right: 104px;
            top: 50%;
            bottom: auto;
            transform: translateY(-50%);
        }

        .app-bg svg { width: 100%; height: 100%; display: block; }

        .app-card:nth-child(2) { border-top: 4px solid #ddd6fe; }
        .app-card:nth-child(2) .app-watermark { background: linear-gradient(135deg, #f6f2fe, #ede9fe); color: #cbbce8; }

        .app-card:nth-child(3) { border-top: 4px solid #a7f3d0; }
        .app-card:nth-child(3) .app-watermark { background: linear-gradient(135deg, #f0fdf6, #d1fae5); color: #9ad9b6; }

        .app-card:nth-child(4) { border-top: 4px solid #fde68a; }
        .app-card:nth-child(4) .app-watermark { background: linear-gradient(135deg, #fff9f0, #fde8c8); color: #e3c896; }

        /* ── Desktop: full-screen meadow, projects as top nav ── */
        @media (min-width: 769px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .col-right { display: none; }

            .project-nav { display: grid; }

            .col-left {
                border-right: none;
            }

            .col-left-content {
                justify-content: center;
                align-items: center;
                padding-bottom: 34vh;
            }

            .site-footer {
                text-align: center;
            }
        }

        .site-footer {
            font-size: 0.78rem;
            color: #9a8c74;
        }

        /* ── Mobile: same full-screen meadow + top nav ── */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .col-right { display: none; }

            .project-nav {
                display: grid;
                padding: 14px 18px;
                column-gap: 14px;
                font-size: 13px;
            }

            .col-left-content {
                justify-content: center;
                align-items: center;
                padding-bottom: 30vh;
            }

            .col-left {
                background: url('software78-meadow-mobile.png') center bottom / cover no-repeat, #fdf8f0;
                border-right: none;
            }

            .site-footer {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="grid">

        <!-- Left: identity & links -->
        <div class="col-left">
            <nav class="project-nav">
                <a class="pn-link pn-left" href="https://www.surge15.app">surge15</a>
                <a class="pn-link pn-center" href="#">fund78</a>
                <a class="pn-link pn-right" href="https://www.hamillpainting.com">hpw</a>
            </nav>
            <div class="col-left-content">
                <div class="logo-placeholder">Logo</div>
                <div class="company-name">software78</div>
                <div class="motto">"Software For Humans"</div>
                <div class="social-links">
                    <a href="#" target="_blank" rel="noopener" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    </a>
                </div>
            </div>
            <footer class="site-footer">made by software78</footer>
        </div>

        <!-- Right: apps grid (floating ghost cards) -->
        <div class="col-right">
            <div class="apps-grid">
                <a class="app-card surge" href="https://www.surge15.app">
                    <div class="app-watermark">
                        <img class="surge-icon" src="surge-icon.png" alt="surge15">
                    </div>
                    <div class="app-label">
                        <div class="app-name">surge15</div>
                        <div class="app-desc">Your block. Your track. Surge.</div>
                    </div>
                </a>
                <a class="app-card" href="#">
                    <div class="app-watermark">logo</div>
                    <div class="app-label">
                        <div class="app-name">fund78</div>
                        <div class="app-desc">One-line description here</div>
                    </div>
                </a>
                <a class="app-card" href="https://www.hamillpainting.com">
                    <div class="app-watermark">logo</div>
                    <div class="app-label">
                        <div class="app-name">hpw</div>
                        <div class="app-desc">One-line description here</div>
                    </div>
                </a>
            </div>
        </div>

    </div>
</body>
</html>
